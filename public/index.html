<meta name="build-version" content="dev" />
<script>
  // Always the newest deploy: when a newer version is out than this page
  // (a browser can keep an old copy of it), reload once under a new address,
  // which fetches the page and every file fresh. Checked on open and whenever
  // the tab comes back.
  (function () {
    var mine = document.querySelector('meta[name="build-version"]').content;
    if (mine === 'dev') return;
    function check() {
      fetch('./version.json?t=' + Date.now(), { cache: 'no-store' })
        .then(function (r) { return r.ok ? r.json() : null; })
        .then(function (latest) {
          if (!latest || !latest.version || latest.version === mine) return;
          try {
            if (sessionStorage.getItem('stockStudy.reloadedTo') === latest.version) return;
            sessionStorage.setItem('stockStudy.reloadedTo', latest.version);
          } catch (e) {}
          location.replace(location.pathname + '?v=' + latest.version + location.hash);
        })
        .catch(function () {});
    }
    check();
    document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible') check(); });
  })();
</script>

<!-- kit:head: where the app's stylesheets end, before any module. The kit
     comes from one place for every app (Shared-Proxy's GitHub Pages, same
     site as the apps), at the version this device last saw (quadra.kit, set
     by the kit's watchUpdates), so a change to the kit is one push to
     Shared-Proxy and every app has it the next time it's opened. -->
<script>!function(b,v,q,m,f,i){try{v=localStorage.getItem('quadra.kit')||''}catch(e){v=''}q=v?'?v='+encodeURIComponent(v):'';m={'#kit/':b};f=['quadra.mjs','logos.mjs','names.mjs','photos.mjs','catalog.mjs'];for(i=0;i<f.length;i++)m['#kit/'+f[i]]=b+f[i]+q;window.QUADRA_KIT={base:b,version:v,url:function(x){return b+x+q}};document.write('<script type="import'+'map">'+JSON.stringify({imports:m})+'<\/script><link rel="stylesheet" href="'+b+'quadra.css'+q+'"><link rel="modulepreload" href="'+b+'quadra.mjs'+q+'"><link rel="modulepreload" href="'+b+'brand.mjs'+q+'">')}('../Shared-Proxy/kit/')</script>
