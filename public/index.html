<meta name="build-version" content="dev" />
<script>
  // Always the newest deploy: when a newer version is out than this page
  // (a browser can keep an old copy of it), reload once under a new address,
  // which fetches the page and every file fresh. Checked on open and whenever
  // the tab comes back.
  (function () {
    var mine = document.querySelector('meta[name="build-version"]').content;
    if (mine === 'dev') return;
    function check() {
      fetch('./version.json?t=' + Date.now(), { cache: 'no-store' })
        .then(function (r) { return r.ok ? r.json() : null; })
        .then(function (latest) {
          if (!latest || !latest.version || latest.version === mine) return;
          try {
            if (sessionStorage.getItem('stockStudy.reloadedTo') === latest.version) return;
            sessionStorage.setItem('stockStudy.reloadedTo', latest.version);
          } catch (e) {}
          location.replace(location.pathname + '?v=' + latest.version + location.hash);
        })
        .catch(function () {});
    }
    check();
    document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible') check(); });
  })();
</script>

      <p id="loading-error-text"></p>
      <div class="button-row">
        <button id="loading-reload" class="ghost-button" type="button">重新整理 · Reload</button>
        <button id="loading-skip" class="ghost-button" type="button">直接開啟 · Open anyway</button>
      </div>
    </div>
  </div>
</div>
<script>
  // Failsafe that doesn't depend on the app's own scripts: if they fail to
  // load or never start, offer a way out instead of an endless loading screen.
  (function () {
    var zh = /^zh/i.test(navigator.language || '');
    function $(id) { return document.getElementById(id); }
    window.__stockFail = function (message) {
      if ($('loading').hidden) return;
      $('loading-error-text').textContent = message || (zh ? '頁面沒有正常啟動，可能是網路不穩。' : "The page didn't start, maybe a network hiccup.");
      $('loading-error').hidden = false;
      $('loading-spinner').hidden = true;
    };
    $('loading-reload').onclick = function () { location.reload(); };
    $('loading-skip').onclick = function () { $('loading').hidden = true; };
    window.addEventListener('error', function () { if (!window.__stockStarted) window.__stockFail(); });
    setTimeout(function () { if (!window.__stockStarted) window.__stockFail(); }, 15000);
  })();
</script>
