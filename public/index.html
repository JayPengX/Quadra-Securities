<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#0f766e" />
<meta name="build-version" content="dev" />
<script>
  // Always the newest deploy: when a newer version is out than this page
  // (a browser can keep an old copy of it), reload once under a new address,
  // which fetches the page and every file fresh. Checked on open and whenever
  // the tab comes back.
  (function () {
    var mine = document.querySelector('meta[name="build-version"]').content;
    if (mine === 'dev') return;
    function check() {
      fetch('./version.json?t=' + Date.now(), { cache: 'no-store' })
        .then(function (r) { return r.ok ? r.json() : null; })
        .then(function (latest) {
          if (!latest || !latest.version || latest.version === mine) return;
          try {
            if (sessionStorage.getItem('stockStudy.reloadedTo') === latest.version) return;
            sessionStorage.setItem('stockStudy.reloadedTo', latest.version);
          } catch (e) {}
          location.replace(location.pathname + '?v=' + latest.version + location.hash);
        })
        .catch(function () {});
    }
    check();
    document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible') check(); });
  })();
</script>

<body>

<header class="q-appbar">

      <h2 id="list-title" class="section-heading"></h2>

      <div id="quote-list" class="card list-card"></div>
    </section>
  </div>

  <div id="panel-portfolio" class="tab-panel" role="tabpanel" aria-labelledby="tab-portfolio" hidden>
    <div id="portfolio-body"></div>
  </div>

  <div id="panel-fx" class="tab-panel" role="tabpanel" aria-labelledby="tab-fx" hidden>
    <div id="fx-body"></div>
  </div>

  <div id="panel-history" class="tab-panel" role="tabpanel" aria-labelledby="tab-history" hidden>
    <div id="history-body"></div>
  </div>
