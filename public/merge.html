<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0d9488" />
<title>四方合併工具 · Quadra merge tool</title>
<meta name="description" content="把舊的股市研究室、賠率研究室、英單力同步碼和四方通行碼合成一組新的四方通行碼。" />
<meta name="robots" content="noindex" />
<link rel="icon" href="./favicon.svg" type="image/svg+xml" />
<link rel="stylesheet" href="./styles.css" />
<link rel="stylesheet" href="./quadra.css" />
<style>
  body { background: var(--page); color: var(--text-primary); font-family: var(--quadra-font); margin: 0; }
  .merge { max-width: 640px; margin: 0 auto; padding: max(20px, env(safe-area-inset-top)) 16px 40px; }
  .merge-brand { display: flex; align-items: center; gap: 12px; margin: 8px 0 16px; }
  .merge-brand img { width: 48px; height: 48px; border-radius: 14px; }
  .merge-brand p { margin: 0; font-size: 0.75rem; letter-spacing: 0.16em; color: var(--text-muted); font-weight: 700; }
  .merge-brand h1 { margin: 0; font-size: 1.35rem; }
  .merge .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow-sm); margin-bottom: 14px; }
  .merge-row { display: grid; grid-template-columns: minmax(0, 150px) minmax(0, 1fr) auto; gap: 8px; margin-bottom: 8px; }
  .merge-row select, .merge-row input, .merge-into input { width: 100%; min-width: 0; font: inherit; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--border); background: var(--surface-raised); color: var(--text-primary); }
  .merge-row input, .merge-into input { text-transform: uppercase; letter-spacing: 0.06em; }
  .merge-row button { border: 0; background: none; color: var(--text-muted); font-size: 1.2rem; cursor: pointer; }
  .merge-steps { padding-left: 20px; line-height: 1.6; color: var(--text-secondary); }
  .merge-result { text-align: center; }
  .merge-code { font-size: 1.8rem; font-weight: 800; letter-spacing: 0.08em; margin: 8px 0; font-variant-numeric: tabular-nums; }
  .merge-error { color: var(--bad, #c2410c); font-weight: 600; }
  .merge .button-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .merge button.primary { background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 999px; padding: 11px 18px; font: inherit; font-weight: 700; cursor: pointer; }
  .merge button.primary:disabled { opacity: 0.5; }
  .merge button.ghost { background: var(--surface-raised); color: var(--text-primary); border: 1px solid var(--border); border-radius: 999px; padding: 10px 16px; font: inherit; cursor: pointer; }
  @media (max-width: 420px) { .merge-row { grid-template-columns: 1fr auto; } .merge-row select { grid-column: 1 / -1; } }
</style>
</head>
<body>
<main class="merge">
  <div class="merge-brand"><img src="./favicon.svg" alt="" /><div><p>四方 QUADRA</p><h1 id="title"></h1></div></div>
  <div class="card">
    <p id="intro"></p>
    <ol class="merge-steps" id="steps"></ol>
  </div>
  <form class="card" id="form">
    <div id="rows"></div>
    <div class="button-row"><button class="ghost" type="button" id="add"></button></div>
    <div class="merge-into" style="margin-top:14px">
      <label><span id="into-label"></span><input id="into" autocomplete="off" autocapitalize="characters" placeholder="XXXXX-XXXXX" /></label>
    </div>
    <p id="warning" class="note"></p>
    <label style="display:flex;gap:8px;align-items:flex-start;margin:10px 0"><input type="checkbox" id="sure" /><span id="sure-label"></span></label>
    <div class="button-row"><button class="primary" type="submit" id="go" disabled></button></div>
    <p id="error" class="merge-error" role="alert"></p>
  </form>
  <div class="card merge-result" id="result" hidden>
    <p id="done-title"></p>
    <p class="merge-code" id="code"></p>
    <div class="button-row" style="justify-content:center"><button class="ghost" type="button" id="copy"></button></div>
    <p id="done-note" class="muted"></p>
    <div class="quadra-apps" id="apps"></div>
  </div>
</main>
<script type="module">
  import { APPS, PASS_PATTERN, LEGACY_PATTERNS, cleanCode, formatPass, ecoMerge, storePass } from './lib/quadra.mjs';

  const en = !/^zh/i.test(navigator.language || 'zh');
  const T = en
    ? {
        title: 'Merge tool',
        intro: 'A one-time tool: enter every sync code you have, from any Quadra app, and they become one new Quadra Pass that works everywhere.',
        steps: ['Everything is read first; nothing changes unless every code is found.', 'Each app\'s data moves to the new pass (several of one app are combined the next time that app opens), and the money of every account goes into one shared pool.', 'Then the old codes stop working and their old data is deleted.', 'Open each app once with the new pass to finish.'],
        add: '+ Another code', into: 'Merge into a Quadra Pass you already have (optional; empty makes a new one)',
        warning: 'Old codes stop working and their data is deleted once merged. This can\'t be undone.',
        sure: 'I understand: the old codes and their old data will be removed.', go: 'Merge', working: 'Merging…',
        doneTitle: 'Your new Quadra Pass', copy: 'Copy', copied: 'Copied',
        doneNote: 'Write it down: it\'s the only key to your account. Open each app and enter it (on this browser it\'s already filled in).',
        bad: 'Row {n}: that code doesn\'t look like a {app} code.', notFound: 'Row {n}: no account has that code.', failed: 'Merge failed: {msg}', none: 'Enter at least one code.',
        apps: { stock: 'Stock Study / Quadra Securities (8)', odds: 'Odds Study / Quadra Sportsbook (8)', vocab: 'Orbit Vocab / Quadra Words (16)', eco: 'Quadra Pass (10)' }
      }
    : {
        title: '合併工具',
        intro: '一次性的工具：輸入你所有 App 的同步碼，合併成一組新的四方通行碼，四個 App 都能用。',
        steps: ['先讀取全部代碼；只要有一組找不到，就什麼都不會改。', '每個 App 的資料搬到新碼（同一個 App 有好幾個帳戶，會在下次打開那個 App 時合在一起），所有帳戶的錢進同一個共用資金池。', '接著舊代碼作廢、舊資料刪除。', '用新碼把每個 App 打開一次就完成了。'],
        add: '＋ 再加一組', into: '合併到你已有的四方通行碼（選填；空白就建立新的）',
        warning: '合併後舊代碼會作廢、舊資料會刪除，無法復原。',
        sure: '我了解：舊代碼和舊資料會被移除。', go: '合併', working: '合併中…',
        doneTitle: '你的新四方通行碼', copy: '複製', copied: '已複製',
        doneNote: '請記下來：這是帳戶唯一的鑰匙。打開每個 App 輸入它（這個瀏覽器已經自動填好）。',
        bad: '第 {n} 列：這不像 {app} 的代碼。', notFound: '第 {n} 列：找不到這組代碼的帳戶。', failed: '合併失敗：{msg}', none: '請至少輸入一組代碼。',
        apps: { stock: '股市研究室／四方證券（8 碼）', odds: '賠率研究室／四方運彩（8 碼）', vocab: '英單力／四方單字（16 碼）', eco: '四方通行碼（10 碼）' }
      };
  const fill = (s, v) => s.replace(/\{(\w+)\}/g, (_, k) => v[k] ?? '');
  const $ = id => document.getElementById(id);
  document.documentElement.lang = en ? 'en' : 'zh-Hant';
  $('title').textContent = T.title;
  $('intro').textContent = T.intro;
  for (const step of T.steps) $('steps').append(Object.assign(document.createElement('li'), { textContent: step }));
  $('add').textContent = T.add;
  $('into-label').textContent = T.into;
  $('warning').textContent = T.warning;
  $('sure-label').textContent = T.sure;
  $('go').textContent = T.go;
  $('copy').textContent = T.copy;
  $('done-title').textContent = T.doneTitle;
  $('done-note').textContent = T.doneNote;

  // The app a code belongs to, guessed from its length (8 could be either
  // Stock Study or Odds Study, so that one is picked by hand).
  const guess = code => (code.length === 10 ? 'eco' : code.length === 16 ? 'vocab' : null);
  function addRow(app = 'stock') {
    const row = document.createElement('div');
    row.className = 'merge-row';
    const select = document.createElement('select');
    for (const [value, label] of Object.entries(T.apps)) select.append(new Option(label, value, false, value === app));
    const input = Object.assign(document.createElement('input'), { autocomplete: 'off', placeholder: 'ABCD 2345', spellcheck: false });
    input.setAttribute('autocapitalize', 'characters');
    input.addEventListener('input', () => {
      const g = guess(cleanCode(input.value));
      if (g) select.value = g;
    });
    const remove = Object.assign(document.createElement('button'), { type: 'button', textContent: '✕' });
    remove.setAttribute('aria-label', '✕');
    remove.onclick = () => row.remove();
    row.append(select, input, remove);
    $('rows').append(row);
  }
  addRow('stock');
  addRow('odds');
  addRow('vocab');
  $('add').onclick = () => addRow();
  $('sure').onchange = () => ($('go').disabled = !$('sure').checked);

  $('form').onsubmit = async event => {
    event.preventDefault();
    $('error').textContent = '';
    const rows = [...$('rows').children];
    const sources = [];
    for (const [i, row] of rows.entries()) {
      const code = cleanCode(row.querySelector('input').value);
      if (!code) continue;
      const app = row.querySelector('select').value;
      const pattern = app === 'eco' ? PASS_PATTERN : LEGACY_PATTERNS[app];
      if (!pattern.test(code)) return ($('error').textContent = fill(T.bad, { n: i + 1, app: T.apps[app] }));
      sources.push({ app, passcode: code, row: i });
    }
    if (!sources.length) return ($('error').textContent = T.none);
    const into = cleanCode($('into').value);
    if (into && !PASS_PATTERN.test(into)) return ($('error').textContent = fill(T.bad, { n: '—', app: T.apps.eco }));
    $('go').disabled = true;
    $('go').textContent = T.working;
    try {
      const res = await ecoMerge(sources.map(({ app, passcode }) => ({ app, passcode })), into || undefined);
      storePass(res.passcode);
      $('code').textContent = formatPass(res.passcode);
      $('copy').onclick = () => navigator.clipboard?.writeText(res.passcode).then(() => ($('copy').textContent = T.copied));
      for (const [id, app] of Object.entries(APPS)) {
        const a = Object.assign(document.createElement('a'), { className: 'quadra-app', href: app.path });
        a.append(Object.assign(document.createElement('img'), { src: `${app.path}favicon.svg`, alt: '' }), Object.assign(document.createElement('span'), { textContent: en ? app.en : app.zh }));
        $('apps').append(a);
      }
      $('form').hidden = true;
      $('result').hidden = false;
    } catch (error) {
      const row = error.index != null ? sources[error.index]?.row + 1 : null;
      $('error').textContent = error.code === 'ECO_SOURCE_NOT_FOUND' && row ? fill(T.notFound, { n: row }) : fill(T.failed, { msg: error.message });
      $('go').disabled = false;
      $('go').textContent = T.go;
    }
  };
</script>
</body>
</html>
